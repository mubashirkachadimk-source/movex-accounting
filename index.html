<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MOVEX Accounting</title>
<style>
:root{--navy:#0b2a6b;--blue:#1f6bff;--bg:#f4f6fa;--card:#fff;--ink:#14213d;--mut:#64708a;--line:#dde3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1020;--card:#121a30;--ink:#e8edf8;--mut:#93a0bd;--line:#26314f;--navy:#8fb2ff}}
:root[data-theme=dark]{--bg:#0a1020;--card:#121a30;--ink:#e8edf8;--mut:#93a0bd;--line:#26314f;--navy:#8fb2ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}nav{width:210px;background:#0b2a6b;color:#fff;padding:16px 10px;flex-shrink:0}
nav .b{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:2px;margin:0 6px 18px}nav a{display:block;padding:9px 12px;border-radius:6px;color:#cfdcff;cursor:pointer;margin-bottom:2px}nav a.on,nav a:hover{background:#1f6bff;color:#fff}
main{flex:1;padding:20px;min-width:0}h1{margin:0 0 14px;font-size:20px;color:var(--navy)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.k,.c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}.k small{color:var(--mut)}.k b{display:block;font-size:20px;margin-top:4px;color:var(--navy)}
.c{margin-bottom:14px;overflow-x:auto}table{width:100%;border-collapse:collapse}th{background:#0b2a6b;color:#fff;text-align:left;padding:8px;font-weight:600}td{padding:8px;border-bottom:1px solid var(--line)}.r{text-align:right}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}button{background:#1f6bff;color:#fff;border:0;padding:9px 14px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}button.s{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}.tg{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#e3edff;color:#0b2a6b}
.ln{display:grid;grid-template-columns:3fr 1fr 1.3fr;gap:8px}
#m{position:fixed;inset:0;background:rgba(5,10,25,.7);display:none;overflow:auto;padding:16px;z-index:9}#m.on{display:block}
.doc{background:#fff;color:#0b2a6b;max-width:780px;margin:0 auto;padding:36px;position:relative;overflow:hidden;font-size:13px}
.doc{padding-bottom:70px}.doc svg.g1{position:absolute;pointer-events:none}
.doc .ft{position:absolute;bottom:10px;right:36px;color:#fff;font-size:10px;letter-spacing:2px;z-index:2}.doc .h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.doc h2{margin:0;font-size:26px;letter-spacing:1px}.doc .tl{letter-spacing:4px;font-size:10px;color:#1f6bff}.doc th{background:#0b2a6b;color:#fff}.doc td{color:#14213d;border-color:#e3e8f2}
.doc .tt{margin-left:auto;width:260px}.doc .gt{background:#0b2a6b;color:#fff;font-weight:700}.doc .ln2{border-bottom:1px solid #9fb0d0;padding:4px 0;margin-bottom:8px}.doc .sg{margin-top:50px;border-top:1px solid #0b2a6b;width:200px;padding-top:4px;font-size:11px;margin-bottom:30px}
@media(max-width:700px){.app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px;padding:8px}nav .b{display:none}nav a{white-space:nowrap}.ln{grid-template-columns:1fr}}
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
@page{size:A4;margin:0}
@media print{html,body{background:#fff!important;height:auto!important;padding:0!important}.app{display:none!important}.np{display:none!important}
#m{display:block!important;position:static!important;inset:auto!important;background:#fff!important;padding:0!important;overflow:visible!important}
#m .doc:not(.np){display:block!important;max-width:none!important;width:100%!important;margin:0!important;min-height:285mm;box-shadow:none;background:#fff!important;color:#0b2a6b!important}
.doc th{background:none!important;color:#0b2a6b!important;border-top:2px solid #0b2a6b;border-bottom:2px solid #0b2a6b}.doc .gt td{background:none!important;color:#0b2a6b!important;border-top:2px solid #0b2a6b;border-bottom:2px solid #0b2a6b}}
</style></head><body>
<div class="app"><nav id="nv"></nav><main id="mn"></main></div><div id="m"></div>
<script>
const $=s=>document.querySelector(s);let S=null;try{S=JSON.parse(localStorage.getItem('mvx'))}catch(e){}
S=S||{co:{name:'MOVEX Transportation',addr:'2216 JEDDAH A 1255',web:'www.movextransportaion.sa',phone:'+966 50 123 4567',vat:'',iban:'',tag:'Moving Beyond Limits.',rate:15,logo:''},inv:[],rc:[],cp:[],n:{inv:0,rc:0,cp:0}};
const save=()=>{try{localStorage.setItem('mvx',JSON.stringify(S))}catch(e){}};
const fm=c=>(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);const num=(p,k)=>p+String(S.n[k]).padStart(6,'0');
const O=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],T=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function w(n){if(n<20)return O[n];if(n<100)return T[n/10|0]+(n%10?' '+O[n%10]:'');if(n<1000)return O[n/100|0]+' Hundred'+(n%100?' '+w(n%100):'');for(const[v,s]of[[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand']])if(n>=v)return w(n/v|0)+' '+s+(n%v?' '+w(n%v):'')}
const words=c=>{const r=Math.floor(c/100),h=c%100;return (r?w(r):'Zero')+' Riyals'+(h?' and '+w(h)+' Halalas':'')+' Only'};
const logo=(h=40)=>S.co.logo?`<img src="${S.co.logo}" style="height:${h}px">`:`<svg viewBox="0 0 64 40" height="${h}"><path d="M0 40V14L14 0l12 16-12 24z" fill="#0b2a6b"/><path d="M28 40L46 2h16L44 40z" fill="#1f6bff"/></svg>`;
const T3=[['dash','Dashboard'],['inv','Sales Invoices'],['rc','Receipts'],['cp','Cash Payments'],['jr','Journal'],['set','Settings']];let tab='dash';
function go(t){tab=t;$('#nv').innerHTML=`<div class="b">${logo(26)} MOVEX</div>`+T3.map(([k,l])=>`<a class="${k==t?'on':''}" onclick="go('${k}')">${l}</a>`).join('');V[t]()}
const bal=i=>i.tot-i.paid;
const cash=()=>S.rc.filter(r=>r.m!='Bank Transfer').reduce((a,r)=>a+r.amt,0)-S.cp.filter(r=>r.m!='Bank Transfer').reduce((a,r)=>a+r.amt,0);
const bank=()=>S.rc.filter(r=>r.m=='Bank Transfer').reduce((a,r)=>a+r.amt,0)-S.cp.filter(r=>r.m=='Bank Transfer').reduce((a,r)=>a+r.amt,0);
const tbl=(h,rows)=>`<div class="c"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows||`<tr><td colspan="${h.length}" style="color:var(--mut)">No records yet.</td></tr>`}</table></div>`;
const V={
dash(){const s=S.inv.reduce((a,i)=>a+i.sub,0),v=S.inv.reduce((a,i)=>a+i.vat,0),ar=S.inv.reduce((a,i)=>a+bal(i),0);
$('#mn').innerHTML=`<h1>${esc(S.co.name)} — Dashboard</h1><div class="g">${[['Total Sales',s],['Output VAT Payable',v],['Receivables',ar],['Cash Balance',cash()],['Bank Balance',bank()],['Cash Paid Out',S.cp.reduce((a,r)=>a+r.amt,0)]].map(([l,x])=>`<div class="k"><small>${l}</small><b>SAR ${fm(x)}</b></div>`).join('')}</div><div class="bar"><button onclick="F.inv()">+ New Invoice</button><button class="s" onclick="F.rc()">+ Receive Payment</button><button class="s" onclick="F.cp()">+ Cash Payment</button></div>`+tbl(['Invoice','Customer','Date','Total','Balance'],S.inv.slice(-6).reverse().map(i=>`<tr><td>${i.no}</td><td>${esc(i.cust)}</td><td>${i.date}</td><td class="r">${fm(i.tot)}</td><td class="r">${fm(bal(i))}</td></tr>`).join(''))},
inv(){$('#mn').innerHTML=`<h1>Sales Invoices</h1><div class="bar"><button onclick="F.inv()">+ New Invoice</button></div>`+tbl(['No','Customer','Date','Total','Paid','Balance','Status',''],S.inv.slice().reverse().map(i=>`<tr><td>${i.no}</td><td>${esc(i.cust)}</td><td>${i.date}</td><td class="r">${fm(i.tot)}</td><td class="r">${fm(i.paid)}</td><td class="r">${fm(bal(i))}</td><td><span class="tg">${bal(i)<=0?'Paid':i.paid?'Partially Paid':i.due<today()?'Overdue':'Posted'}</span></td><td><a style="color:var(--blue);cursor:pointer" onclick="D('inv','${i.no}')">View / Print</a></td></tr>`).join(''))},
rc(){$('#mn').innerHTML=`<h1>Receipts</h1><div class="bar"><button onclick="F.rc()">+ Receive Payment</button></div>`+tbl(['No','Date','Received From','Method','Invoice','Amount',''],S.rc.slice().reverse().map(r=>`<tr><td>${r.no}</td><td>${r.date}</td><td>${esc(r.who)}</td><td>${r.m}</td><td>${r.ref||'-'}</td><td class="r">${fm(r.amt)}</td><td><a style="color:var(--blue);cursor:pointer" onclick="D('rc','${r.no}')">View / Print</a></td></tr>`).join(''))},
cp(){$('#mn').innerHTML=`<h1>Cash Payments</h1><div class="bar"><button onclick="F.cp()">+ Cash Payment</button></div>`+tbl(['No','Date','Paid To','Account','Method','Amount',''],S.cp.slice().reverse().map(r=>`<tr><td>${r.no}</td><td>${r.date}</td><td>${esc(r.who)}</td><td>${esc(r.acc)}</td><td>${r.m}</td><td class="r">${fm(r.amt)}</td><td><a style="color:var(--blue);cursor:pointer" onclick="D('cp','${r.no}')">View / Print</a></td></tr>`).join(''))},
jr(){const L=[];S.inv.forEach(i=>{L.push([i.date,i.no,'Accounts Receivable',i.tot,0],[i.date,i.no,'Sales Revenue',0,i.sub],[i.date,i.no,'Output VAT',0,i.vat])});
S.rc.forEach(r=>L.push([r.date,r.no,r.m=='Bank Transfer'?'Bank':'Cash',r.amt,0],[r.date,r.no,'Accounts Receivable',0,r.amt]));
S.cp.forEach(r=>L.push([r.date,r.no,r.acc,r.amt,0],[r.date,r.no,r.m=='Bank Transfer'?'Bank':'Cash',0,r.amt]));
const d=L.reduce((a,x)=>a+x[3],0),c=L.reduce((a,x)=>a+x[4],0);
$('#mn').innerHTML=`<h1>Journal (auto-posted, traceable to source)</h1>`+tbl(['Date','Reference','Account','Debit','Credit'],L.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${esc(x[2])}</td><td class="r">${x[3]?fm(x[3]):''}</td><td class="r">${x[4]?fm(x[4]):''}</td></tr>`).join('')+`<tr><td colspan="3"><b>Totals ${d==c?'(Balanced)':'(UNBALANCED)'}</b></td><td class="r"><b>${fm(d)}</b></td><td class="r"><b>${fm(c)}</b></td></tr>`)},
set(){const c=S.co;$('#mn').innerHTML=`<h1>Settings — Company Profile</h1><div class="c"><div class="f">${[['name','Company Name'],['addr','Address'],['web','Website'],['phone','Phone'],['vat','VAT Registration No.'],['iban','Bank / IBAN'],['tag','Tagline'],['rate','VAT Rate %']].map(([k,l])=>`<div><label>${l}</label><input id="s_${k}" value="${esc(c[k])}"></div>`).join('')}<div><label>Logo (upload)</label><input type="file" id="s_logo" accept="image/*"></div></div><div class="bar"><button onclick="saveSet()">Save Settings</button><button class="s" onclick="S.co.logo='';save();go('set')">Remove Logo</button></div><p style="color:var(--mut)">Demo data is stored in this browser only. Production use requires a server-side database.</p></div>`}};
function saveSet(){const c=S.co;['name','addr','web','phone','vat','iban','tag'].forEach(k=>c[k]=$('#s_'+k).value);c.rate=Math.max(0,parseFloat($('#s_rate').value)||0);const f=$('#s_logo').files[0];
const fin=()=>{save();go('set')};if(f){const r=new FileReader();r.onload=()=>{c.logo=r.result;fin()};r.readAsDataURL(f)}else fin()}
function modal(h){$('#m').innerHTML=`<div class="doc np" style="background:var(--card);color:var(--ink);padding:20px;max-width:780px;margin-bottom:12px">${h}</div>`;$('#m').classList.add('on')}
const closeM=()=>$('#m').classList.remove('on');
const F={
inv(){modal(`<h1>New Sales Invoice</h1><div class="f"><div><label>Customer</label><input id="fc"></div><div><label>Customer VAT No.</label><input id="fv"></div><div><label>Address</label><input id="fa"></div><div><label>Date</label><input type="date" id="fd" value="${today()}"></div><div><label>Due Date</label><input type="date" id="fdu" value="${new Date(Date.now()+30*864e5).toISOString().slice(0,10)}"></div></div><label>Lines (description / qty / unit price SAR, VAT exclusive)</label><div id="ls"></div><div class="bar"><button class="s" onclick="addL()">+ Add line</button><b id="tt"></b></div><div class="bar"><button onclick="postInv()">Post Invoice</button><button class="s" onclick="closeM()">Cancel</button></div>`);addL();addL();$('#ls').oninput=calc},
rc(){const o=S.inv.filter(i=>bal(i)>0);modal(`<h1>Receive Payment</h1><div class="f"><div><label>Against Invoice</label><select id="ri" onchange="pf()"><option value="">— None —</option>${o.map(i=>`<option value="${i.no}">${i.no} · ${esc(i.cust)} · ${fm(bal(i))}</option>`).join('')}</select></div><div><label>Received From</label><input id="rw"></div><div><label>Amount (SAR)</label><input id="ra" type="number" step="0.01"></div><div><label>Method</label><select id="rm"><option>Cash</option><option>Card</option><option>Bank Transfer</option></select></div><div><label>Reference No.</label><input id="rr"></div></div><div class="bar"><button onclick="postRc()">Post Receipt</button><button class="s" onclick="closeM()">Cancel</button></div>`)},
cp(){modal(`<h1>New Cash Payment</h1><div class="f"><div><label>Paid To</label><input id="pw"></div><div><label>Amount (SAR)</label><input id="pa" type="number" step="0.01"></div><div><label>Expense Account</label><select id="pc">${['Fuel','Vehicle Maintenance','Salaries','Office Rent','Utilities','Government Fees','Other Expenses'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Method</label><select id="pm"><option>Cash</option><option>Card</option><option>Bank Transfer</option></select></div><div><label>Reference / Description</label><input id="pr"></div></div><div class="bar"><button onclick="postCp()">Post Payment</button><button class="s" onclick="closeM()">Cancel</button></div>`)}};
function addL(){$('#ls').insertAdjacentHTML('beforeend','<div class="ln" style="margin-bottom:6px"><input placeholder="Description"><input type="number" value="1" min="0" step="any"><input type="number" placeholder="0.00" step="0.01"></div>')}
function lines(){return[...document.querySelectorAll('#ls .ln')].map(r=>{const[i,q,p]=r.querySelectorAll('input');return{d:i.value.trim(),q:parseFloat(q.value)||0,p:Math.round((parseFloat(p.value)||0)*100)}}).filter(l=>l.d&&l.q>0&&l.p>0).map(l=>({...l,t:Math.round(l.q*l.p)}))}
function tots(ls){const sub=ls.reduce((a,l)=>a+l.t,0),vat=Math.round(sub*S.co.rate/100);return{sub,vat,tot:sub+vat}}
function calc(){const t=tots(lines());$('#tt').textContent=`Subtotal ${fm(t.sub)} · VAT ${S.co.rate}% ${fm(t.vat)} · Total SAR ${fm(t.tot)}`}
function postInv(){const ls=lines(),c=$('#fc').value.trim();if(!c||!ls.length)return alert('Customer and at least one valid line are required.');S.n.inv++;const t=tots(ls);
S.inv.push({no:num('INV-','inv'),cust:c,vn:$('#fv').value,ad:$('#fa').value,date:$('#fd').value,due:$('#fdu').value,ls,...t,paid:0});save();closeM();go('inv')}
function pf(){const i=S.inv.find(x=>x.no==$('#ri').value);if(i){$('#rw').value=i.cust;$('#ra').value=(bal(i)/100).toFixed(2)}}
function postRc(){const amt=Math.round((parseFloat($('#ra').value)||0)*100),ref=$('#ri').value,who=$('#rw').value.trim();if(!who||amt<=0)return alert('Payer and a positive amount are required.');
const i=S.inv.find(x=>x.no==ref);if(i&&amt>bal(i))return alert('Amount exceeds the invoice balance.');S.n.rc++;if(i)i.paid+=amt;
S.rc.push({no:num('RC-','rc'),date:today(),who,amt,m:$('#rm').value,ref,rr:$('#rr').value});save();closeM();go('rc')}
function postCp(){const amt=Math.round((parseFloat($('#pa').value)||0)*100),who=$('#pw').value.trim();if(!who||amt<=0)return alert('Payee and a positive amount are required.');
if($('#pm').value=='Cash'&&amt>cash())return alert('Insufficient cash balance.');S.n.cp++;S.cp.push({no:num('CP-','cp'),date:today(),who,amt,acc:$('#pc').value,m:$('#pm').value,d:$('#pr').value});save();closeM();go('cp')}
function head(title,meta){const c=S.co;return`<div class="h"><div>${logo(46)}<div style="font-weight:800;font-size:20px;letter-spacing:2px">${esc(c.name).toUpperCase()}</div><div style="font-size:11px;margin-top:6px">${esc(c.addr)}<br>${esc(c.web)}<br>${esc(c.phone)}${c.vat?'<br>VAT: '+esc(c.vat):''}</div></div><div style="text-align:right"><div class="tl">${esc(c.tag).toUpperCase()}</div><h2 style="margin-top:20px">${title}</h2>${meta}</div></div>`}
const ft=()=>`<svg class="g1" style="top:0;right:0" width="120" height="64" viewBox="0 0 120 64"><polygon points="40,0 120,0 120,64" fill="#0b2a6b"/><polygon points="20,0 34,0 120,54 120,64" fill="#1f6bff"/></svg><svg class="g1" style="left:0;bottom:0;width:100%;height:36px" viewBox="0 0 800 36" preserveAspectRatio="none"><rect width="800" height="36" fill="#0b2a6b"/></svg><svg class="g1" style="left:0;bottom:0" width="130" height="36" viewBox="0 0 130 36"><polygon points="0,0 60,0 100,36 0,36" fill="#0b2a6b" stroke="#fff" stroke-width="0"/><polygon points="50,0 70,0 112,36 92,36" fill="#1f6bff"/></svg><div class="ft">SAUDI ARABIA / GLOBAL REACH</div>`;
function D(k,no){const d=S[k].find(x=>x.no==no),c=S.co;let h;
if(k=='inv')h=`<div class="doc">${head('SALES INVOICE',`<div>Invoice No: <b>${d.no}</b><br>Date: ${d.date}<br>Due: ${d.due}</div>`)}<p><b>Bill To:</b><br>${esc(d.cust)}<br>${esc(d.ad)}<br>${d.vn?'VAT No: '+esc(d.vn):''}</p><table><tr><th>#</th><th>Description</th><th class="r">Qty</th><th class="r">Unit Price</th><th class="r">Total (SAR)</th></tr>${d.ls.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.d)}</td><td class="r">${l.q}</td><td class="r">${fm(l.p)}</td><td class="r">${fm(l.t)}</td></tr>`).join('')}</table><table class="tt" style="margin-top:12px"><tr><td>Subtotal</td><td class="r">${fm(d.sub)}</td></tr><tr><td>VAT (${c.rate}%)</td><td class="r">${fm(d.vat)}</td></tr><tr class="gt"><td>Total Amount (SAR)</td><td class="r">${fm(d.tot)}</td></tr><tr><td>Paid</td><td class="r">${fm(d.paid)}</td></tr><tr><td><b>Balance Due</b></td><td class="r"><b>${fm(bal(d))}</b></td></tr></table><p style="font-size:11px">Payment due by ${d.due}. Goods remain the property of ${esc(c.name)} until full payment.${c.iban?'<br>Bank: '+esc(c.iban):''}</p><div class="sg">Authorized Signature<br>${esc(c.name)}</div>${ft()}</div>`;
else{const isR=k=='rc';h=`<div class="doc">${head(isR?'RECEIPT':'CASH PAYMENT',`<div>No: <b>${d.no}</b><br>Date: ${d.date}</div>`)}<div class="ln2"><b>${isR?'Received From':'Paid To'}:</b> ${esc(d.who)}</div><div class="ln2"><b>Amount (SAR):</b> ${fm(d.amt)}</div><div class="ln2"><b>Amount in Words:</b> ${words(d.amt)}</div><div class="ln2"><b>Method:</b> ${d.m}</div><div class="ln2"><b>${isR?'Against Invoice':'Expense Account'}:</b> ${esc(isR?d.ref||'-':d.acc)}</div><div class="ln2"><b>Reference:</b> ${esc(isR?d.rr:d.d)}</div><div class="sg">${isR?'Received By':'Authorized By'}<br>${esc(c.name)}</div>${ft()}</div>`}
modal(`<div class="bar np"><button onclick="print()">Print / Save PDF</button><button class="s" onclick="closeM()">Close</button></div>`);$('#m').insertAdjacentHTML('beforeend',h)}
go('dash');
</script></body></html>
